<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Nickname Atlas of Southeast Asia</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link rel="stylesheet" type="text/css" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
</head>
<body>

    <div class="container-fluid mt-3">
        <div class="container p-5 mt-3 bg-light text-dark rounded">
            <h1>The Nickname Atlas of Southeast Asia</h1><br>

            <p>Every nation in this region carries a name through geography, history, and myth. Click a country below to uncover the title it has been given.</p>

            <select id="country_input" class="form-select mb-3">
                <option value="">choose a country</option>
                <option value="the land of golden pagodas">Myanmar</option>
                <option value="the land of a million elephants">Laos</option>
                <option value="the kingdom of wonder">Cambodia</option>
                <option value="the land of smiles">Thailand</option>
                <option value="the land of the blue dragon">Vietnam</option>
                <option value="the land of the lion city">Singapore</option>
                <option value="the land of the morning calm">Timor-Leste</option>
                <option value="the emerald of the equator">Indonesia</option>
                <option value="the land of the pearl of the orient seas">Philippines</option>
                <option value="the land of unity">Malaysia</option>
                <option value="the abode of peace">Brunei</option>
            </select>

            <button class="btn btn-primary" py-click="search_nickname">Click👍</button>

            <div id="display1" class="mt-4" style="font-size: 35px;"></div>
        </div>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
